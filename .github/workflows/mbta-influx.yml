name: MBTA Vehicle Locations to InfluxDB

on:
  schedule:
    - cron: '*/5 * * * *'  # Runs every 5 minutes (minimum interval for GitHub Actions)
  workflow_dispatch:  # Allows manual triggering for testing

jobs:
  fetch-and-write:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run MBTA to InfluxDB script
        env:
          MBTA_API_KEY: ${{ secrets.MBTA_API_KEY }}  # Optional
          INFLUX_URL: ${{ secrets.INFLUX_URL }}
          INFLUX_TOKEN: ${{ secrets.INFLUX_TOKEN }}
          INFLUX_ORG: ${{ secrets.INFLUX_ORG }}
          INFLUX_BUCKET: ${{ secrets.INFLUX_BUCKET }}
        run: python scripts/mbta-vehicles.py